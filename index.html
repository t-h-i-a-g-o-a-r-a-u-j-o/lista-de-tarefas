<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Aplicação de lista de tarefas desenvolvida em HTML, CSS e JavaScript com armazenamento local."
  >
  <title>Lista de Tarefas Interativa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header class="cabecalho">
      <h1>📝 Lista de Tarefas</h1>
      <p>Organize suas tarefas de forma simples e rápida.</p>
    </header>

    <section class="input-area" aria-label="Adicionar nova tarefa">
      <input
        id="tarefa-input"
        type="text"
        placeholder="Digite uma nova tarefa..."
        maxlength="100"
        autocomplete="off"
      >
      <button id="btn-adicionar" type="button">
        Adicionar
      </button>
    </section>

    <section class="controles">
      <div class="filtros" aria-label="Filtros de tarefas">
        <button class="filtro ativo" data-filtro="todas" type="button">
          Todas
        </button>

        <button class="filtro" data-filtro="pendentes" type="button">
          Pendentes
        </button>

        <button class="filtro" data-filtro="concluidas" type="button">
          Concluídas
        </button>
      </div>

      <button id="btn-limpar-concluidas" class="btn-secundario" type="button">
        Limpar concluídas
      </button>
    </section>

    <p id="contador-tarefas" class="contador"></p>

    <p id="mensagem-vazia" class="mensagem-vazia">
      Nenhuma tarefa cadastrada.
    </p>

    <ul id="lista-tarefas" aria-live="polite"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
